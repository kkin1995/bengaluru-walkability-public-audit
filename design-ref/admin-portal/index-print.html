<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Namma Daari · Admin Design System (Print)</title>

  <link rel="stylesheet" href="tokens.css"/>
  <style>
    html, body { margin: 0; padding: 0; background: #f5f5f4; font-family: 'Inter', -apple-system, system-ui, sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; color-adjust: exact; }
    #root { width: 100%; }

    /* Each .print-page is a printed sheet. On screen, render as a stacked A4-landscape card. */
    .print-page {
      width: 29.7cm;
      height: 21cm;
      margin: 12px auto;
      background: #ffffff;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      box-sizing: border-box;
      overflow: hidden;
      position: relative;
    }

    /* The .print-frame-body holds an artboard at its native pixel size; we set transform via JS to fit the page. */
    .print-frame-body {
      transform-origin: top left;
    }

    @page {
      size: A4 landscape;
      margin: 0.5cm;
    }

    @media print {
      html, body { background: #ffffff; }
      .print-page {
        width: 100%;
        height: 100vh;
        margin: 0;
        box-shadow: none;
        page-break-after: always;
        break-after: page;
      }
      .print-page:last-child {
        page-break-after: auto;
        break-after: auto;
      }
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <!-- Order: data → primitives → foundations → A → B → print app (no design-canvas) -->
  <script src="data.js"></script>
  <script type="text/babel" src="primitives.jsx"></script>
  <script type="text/babel" src="foundations.jsx"></script>
  <script type="text/babel" src="screens-a-mobile.jsx"></script>
  <script type="text/babel" src="screens-a-desktop.jsx"></script>
  <script type="text/babel" src="screens-b-mobile.jsx"></script>
  <script type="text/babel" src="screens-b-desktop.jsx"></script>
  <script type="text/babel" src="canvas-app-print.jsx"></script>

  <!-- Auto-print after fonts + layout settle -->
  <script type="text/babel">
    (function autoPrint() {
      const ready = () => new Promise(r => {
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => r());
        else r();
      });
      ready().then(() => {
        // Babel transforms may still be in flight; wait until #root has children + an extra grace period
        const wait = () => {
          if (document.getElementById("root").children.length > 0 && document.querySelectorAll(".print-page").length > 0) {
            setTimeout(() => window.print(), 700);
          } else {
            setTimeout(wait, 100);
          }
        };
        wait();
      });
    })();
  </script>
</body>
</html>
