# Rust dependency vulnerability allowlist for cargo-audit.
# Add CVE IDs here ONLY when no fix is available upstream and the risk
# has been assessed and documented. Remove entries as fixes become available.
#
# Format:
# [advisories]
# ignore = ["RUSTSEC-YYYY-NNNN"]  # crate_name — reason and date assessed
#
# Run manually: cd backend && cargo audit
# CI enforces this on every PR via .github/workflows/ci.yml

[advisories]
ignore = [
  # RUSTSEC-2023-0071: rsa 0.9.10 — Marvin Attack timing side-channel.
  # Transitive via sqlx-mysql (part of sqlx 0.7.x bundle). We use Postgres only;
  # sqlx-mysql is not instantiated at runtime. No fix available upstream (2025-04).
  # Track: upgrade sqlx to 0.8+ when sqlx 0.8 API migration is scoped.
  "RUSTSEC-2023-0071",

  # RUSTSEC-2024-0363: sqlx 0.7.4 — data exposure risk via concat_with_sql_fragment.
  # Fix requires upgrading to sqlx >= 0.8.1, which is a breaking API change (0.7→0.8).
  # Tracked as tech debt: sqlx upgrade scoped for a dedicated dependency-update phase.
  # Assessed 2026-04-14: no user-facing query uses the affected code path.
  "RUSTSEC-2024-0363",

  # RUSTSEC-2026-0097: rand 0.9.2 — unsound when using a custom logger with rand::rng().
  # Transitive via governor 0.10 (rate-limiter middleware). We do not use a custom global
  # logger that would trigger the unsound path; governor uses rand internally for jitter
  # only. No fix available in the governor 0.10 release line (2026-04-25).
  # Track: reassess when governor releases a version pinned to rand >= 0.9.3 (if fixed).
  "RUSTSEC-2026-0097",

  # RUSTSEC-2026-0098: rustls-webpki 0.101.7 — URI name constraints incorrectly accepted.
  # RUSTSEC-2026-0099: rustls-webpki 0.101.7 — wildcard name constraints incorrectly accepted.
  # RUSTSEC-2026-0104: rustls-webpki 0.101.7 — reachable panic in CRL parsing.
  # All three are transitive via sqlx 0.7.4 → sqlx-core 0.7.4 → rustls 0.21.12 → rustls-webpki 0.101.7.
  # Fix requires upgrading sqlx to 0.8+ (breaking API change, same blocker as RUSTSEC-2024-0363).
  # The vulnerable code path (TLS certificate validation) is not exercised: our PostgreSQL
  # connection uses plain TCP (no sslmode=require), so rustls-webpki is never invoked.
  # Assessed 2026-04-25.
  "RUSTSEC-2026-0098",
  "RUSTSEC-2026-0099",
  "RUSTSEC-2026-0104",
]
