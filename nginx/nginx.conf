# Rate limiting — POST-only upload zone. The map means GET/HEAD requests never
# consume tokens; only POST (photo submissions) are throttled.
map $request_method $upload_limit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $upload_limit_key zone=upload:10m rate=5r/m;

# Stricter rate-limit zone for the admin login endpoint — 5 req/min per IP,
# applied unconditionally regardless of HTTP method (no map needed here because
# login is always POST and we want to count every attempt).
limit_req_zone $binary_remote_addr zone=admin_login:10m rate=5r/m;

# General admin API zone — covers all /api/admin/* routes (GET and POST alike).
# 60 req/min allows normal dashboard browsing while deterring enumeration or scraping.
# The stricter admin_login zone takes precedence for /api/admin/auth/login via
# exact-match location; this zone handles everything else under /api/admin/.
limit_req_zone $binary_remote_addr zone=admin_api:10m rate=60r/m;

# Public GeoJSON open-data zone — 2 req/min per IP (D-18 defense-in-depth).
# Primary layer: nginx enforces rate before the request hits the Axum backend.
# Secondary layer: AppState.geojson_rate_limiter provides in-process enforcement.
# proxy_read_timeout 120s is set on the location block below — streaming GeoJSON
# of all reports can exceed the default 30s on large datasets.
limit_req_zone $binary_remote_addr zone=geojson_public:10m rate=2r/m;

# Named upstream so all proxy_pass directives reference a single definition.
# Change the server address here if the backend service name or port changes.
upstream backend {
    server backend:3001;
}

# Named upstream for the Next.js frontend service.
upstream frontend {
    server frontend:3000;
}

# JSON access log with request_id for structured log aggregation.
log_format json_combined escape=json
    '{"time":"$time_iso8601",'
    '"request_id":"$request_id",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"bytes_sent":$bytes_sent,'
    '"request_time":$request_time,'
    '"remote_addr":"$remote_addr",'
    '"http_user_agent":"$http_user_agent"}';

access_log /var/log/nginx/access.log json_combined;

server {
    listen 80;
    server_name _;

    # ── TLS Termination ──────────────────────────────────────────────────────
    # This nginx instance listens on port 80 only. In production, TLS MUST be
    # terminated upstream — either by a cloud load balancer (AWS ALB, GCP LB,
    # Cloudflare) or by adding a TLS listener here.
    #
    # To add TLS directly to this nginx:
    #   1. Mount certs: volumes: - ./certs:/etc/letsencrypt:ro
    #   2. Uncomment the block below and update server_name.
    #   3. Set COOKIE_SECURE=true in docker-compose.yml (already the default).
    #
    # listen 443 ssl;
    # server_name walkability.example.com;
    # ssl_certificate     /etc/letsencrypt/live/walkability.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/walkability.example.com/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    # # HTTP -> HTTPS redirect (add as separate server block):
    # # server { listen 80; return 301 https://$host$request_uri; }
    # ──────────────────────────────────────────────────────────────────────────

    client_max_body_size 20M;
    # P1-1: Buffer large request bodies (photo uploads) in memory before spooling to disk.
    # Without this nginx defaults to 8k, causing multipart uploads to always hit the temp
    # path and adds unnecessary disk I/O for small payloads.
    client_body_buffer_size 10m;
    # P1-1: Explicit temp path avoids permission issues on some distros and makes it easy
    # to mount a fast volume here if upload throughput becomes a bottleneck.
    client_body_temp_path /tmp/nginx_upload_temp;

    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # Public GeoJSON open-data — exact-match, 2 req/min per IP (D-18).
    # proxy_read_timeout 120s: streaming all reports may exceed the default 30s.
    # burst=1 nodelay: allows one extra burst request but no queue.
    location = /api/reports.geojson {
        limit_req zone=geojson_public burst=1 nodelay;
        limit_req_status 429;
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    120s;
    }

    # Admin login — exact-match, stricter rate limit than the general API zone.
    # Exact-match (=) takes precedence over the prefix /api/ block regardless of
    # declaration order, but placing it first makes the intent explicit.
    location = /api/admin/auth/login {
        limit_req zone=admin_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # WR-07: add X-Forwarded-Proto so the login handler (and any future
        # audit logging) can determine whether the request arrived over HTTPS.
        # All other proxy blocks already include this header; the login block
        # was the only one missing it.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # All other admin API routes — prefix match wins over /api/ for /api/admin/* paths.
    # The exact-match location = /api/admin/auth/login still takes priority for login
    # specifically (nginx exact-match beats prefix match regardless of order).
    # burst=10 accommodates dashboard page-load fan-out (user list + stats in parallel).
    location /api/admin/ {
        limit_req zone=admin_api burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # API requests → Rust backend
    location /api/ {
        limit_req zone=upload burst=2 nodelay;
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;
    }

    # Uploaded images → Rust backend ServeDir
    location /uploads/ {
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Health check → backend
    location /health {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # Admin frontend routes — more specific prefix than / so nginx routes /admin*
    # here first. Security headers are scoped to admin pages only to avoid
    # restricting the public map (which uses blob: for Leaflet tiles and
    # data: URIs for marker icons — both permitted in the img-src below).
    location /admin {
        # Prevent clickjacking of the admin dashboard.
        add_header X-Frame-Options "DENY" always;
        # Prevent MIME-type sniffing on admin page responses.
        add_header X-Content-Type-Options "nosniff" always;
        # Limit referer leakage when navigating away from admin pages.
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # CSP policy for admin pages:
        # - script-src 'unsafe-inline': ACCEPTED RISK — Next.js injects inline script
        #   chunks at build time. No dangerouslySetInnerHTML, no user-generated HTML
        #   rendered raw. Compensating controls: EXIF stripping, input sanitization.
        #   Full remediation requires per-request CSP nonces from Next.js middleware
        #   with nginx header propagation. Tracked for post-launch.
        #   See: https://github.com/kkin1995/bengaluru-walkability-public-audit/issues/TBD
        # - style-src 'unsafe-inline': ACCEPTED RISK — admin portal uses inline styles
        #   throughout (JSX style={} props drive the CSS-variable design system).
        #   Removing it blocks all flex layouts, colors, and fonts silently.
        #   Full remediation requires migrating component styles to CSS classes.
        #   Tracked for post-launch alongside the script-src nonce work.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob: https://unpkg.com https://*.tile.openstreetmap.org; connect-src 'self';" always;

        proxy_pass http://frontend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_http_version 1.1;
    }

    # Everything else → Next.js frontend
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_http_version 1.1;
    }
}
