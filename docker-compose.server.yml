# Backend-only production override for self-hosted desktop deployment behind a Cloudflare tunnel.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.server.yml up -d db backend nginx
#
# What this override does:
#   - Removes the blocking frontend dependency from nginx: the base file gates nginx startup
#     on frontend being healthy; this override sets frontend to required: false so nginx
#     starts without waiting for (or needing) the frontend container.
#   - Swaps the nginx mounted config to nginx.server.conf (backend-only routes, catch-all 404)
#   - Parks the frontend service behind the `frontend-only` profile so it never starts
#     under this override unless explicitly requested with --profile frontend-only
#
# What this override does NOT redefine:
#   - db: inherits unchanged from docker-compose.yml
#   - backend: inherits unchanged from docker-compose.yml
#
# Named volumes (postgres_data, uploads) are defined in docker-compose.yml and not
# repeated here to avoid accidental redefinition.

services:
  nginx:
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
        required: false
    volumes:
      - ./nginx/nginx.server.conf:/etc/nginx/conf.d/default.conf:ro

  frontend:
    profiles:
      - frontend-only
