# Staging Docker Compose override — isolated from production on the same Proxmox LXC.
#
# Staging isolation model:
#   - Staging nginx publishes on HOST port 3011:80 (production nginx owns port 80)
#   - Backend runs on container-internal port 3011 (production: 3001)
#   - PostgreSQL data stored in named volume postgres_staging_data (production: postgres_data)
#   - Uploads stored in named volume uploads_staging (production: uploads)
#   - PUBLIC_URL set to https://staging-api.nammadaari.com (production: https://api.nammadaari.com)
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.staging-server.yml up -d db backend nginx
#
# The Cloudflare Tunnel second ingress rule routes staging-api.nammadaari.com →
# http://localhost:3011, which reaches this staging nginx container.
# Production nginx continues to own port 80 — running both stacks simultaneously
# is safe because this file uses 3011:80 instead of 80:80.
#
# CORS_ORIGIN is provided via the GitHub "staging" Environment secret — do not
# hardcode it here. Value: https://staging.nammadaari.com
#
# What this override does NOT redefine:
#   - db: overrides volume and host port only; inherits image, healthcheck, restart, etc. from base
#   - backend: overrides port, PUBLIC_URL, volumes, and healthcheck only; inherits image, build,
#     DATABASE_URL (still uses db:5432 — the 5432 port is always the container-internal port),
#     JWT_SECRET, and all other env vars from the base file

services:
  db:
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    # Expose PostgreSQL on host port 5433 for staging debugging convenience (solo developer, D-06).
    # The backend connects via Docker internal network (db:5432) — this host binding is
    # only for external psql access during debugging.
    ports:
      - "5433:5432"

  backend:
    environment:
      PORT: "3011"
      PUBLIC_URL: https://staging-api.nammadaari.com
    volumes:
      - uploads_staging:/app/uploads
    expose:
      - "3011"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3011/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3

  nginx:
    ports:
      - "3011:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
        required: false
    volumes:
      - ./nginx/nginx.staging-server.conf:/etc/nginx/conf.d/default.conf:ro

  frontend:
    profiles:
      - frontend-only

# Staging-specific named volumes only — do NOT repeat postgres_data or uploads
# from docker-compose.yml (Compose merges them; redeclaring would not rename them
# but could cause unexpected behaviour with volume labels).
volumes:
  postgres_staging_data:
  uploads_staging:
